name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: build docker image
        run: docker buildx build --platform linux/amd64 -t flutter-apk-builder --load .
      
      - name: Extract APK from the image
        run: |
          docker create --name temp-builder flutter-apk-builder 
          docker cp temp-builder:/app/build/app/outputs/flutter-apk/app-release.apk ./app-release.apk
          docker rm temp-builder

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk